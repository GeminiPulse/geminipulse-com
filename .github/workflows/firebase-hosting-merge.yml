name: Build & Verify GeminiPulse v2.0
on:
  push:
    branches:
      - v2.0
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: public/package-lock.json
      - name: Install and build production bundle
        working-directory: public
        run: npm ci && npm run build
      - name: Deploy to Firebase Hosting (if service account configured)
        if: ${{ env.FIREBASE_SERVICE_ACCOUNT != '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEMINIPULSE_COM }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEMINIPULSE_COM }}
          channelId: live
          projectId: geminipulse-com
